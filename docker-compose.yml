# Local infrastructure for LeadWave.
# No Docker? Use hosted equivalents instead and point DATABASE_URL / REDIS_URL at them:
#   Postgres -> Neon, Supabase, Railway    Redis -> Upstash, Railway
services:
  postgres:
    image: postgres:16-alpine
    container_name: leadwave-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: leadwave
      POSTGRES_PASSWORD: leadwave
      POSTGRES_DB: leadwave
    ports:
      - "5432:5432"
    volumes:
      - leadwave-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leadwave -d leadwave"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: leadwave-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - leadwave-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leadwave-pgdata:
  leadwave-redisdata:
